<!doctype html>
<html lang="ko">
<!--
# SectionTag

섹션 맨 위 태그 박스. `loq-tag` + `tag`.

- 최소 125 × 50, 좌우 22px, 1px `line-tag`, 좌상단·우하단 2px `glow` 코너 브래킷 14px, `glow-tag` 광선.
- 글자 18 Bold `tag-text`, 대문자. 내용과 맞는 영문(CPU, COOLER, BATTERY, GAMING SETUP).
-->
<head><meta charset="utf-8">
<meta name="viewport" content="width=860">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="loq.css"><title>SectionTag</title>
<style>html,body{margin:0;background:var(--bg-000);} .pad{padding:36px;}.row{display:flex;gap:16px;flex-wrap:wrap}</style></head>
<body class="loq">
<div class="pad"><div class="row"><span class="loq-tag tag">CPU</span><span class="loq-tag tag">Cooler</span><span class="loq-tag tag">Battery</span><span class="loq-tag tag">Gaming setup</span></div></div>
</body>
</html>

<!doctype html>
<html lang="ko">
<!--
# SectionHeader

`.loq-section` 안에서 태그 → 2줄 헤드라인 → 본문. 가운데 정렬.

- 섹션 경계 → 태그 `space-125`(섹션 padding-top), 태그 → 헤드라인 `space-35`, 헤드라인 → 본문 `space-30`, 본문 → 다음 블록 `space-50`.
- 헤드라인 `display`: 1줄 `ink-100`, 2줄 `.loq-grad`.
- 본문 `body-lg`(24/38 Medium) `ink-200`, 강조 구절 `<b>`(SemiBold, 흰색). 단축키는 인라인 `KeyCap`.
-->
<head><meta charset="utf-8">
<meta name="viewport" content="width=860">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="loq.css"><title>SectionHeader</title>
<style>html,body{margin:0;background:var(--bg-000);} .pad{padding:0;}.loq-section{padding-bottom:80px}</style></head>
<body class="loq">
<div class="loq-canvas"><section class="loq-section"><div class="loq-divider"><svg viewBox="0 0 30 64" aria-hidden="true"><circle class="ring" cx="15" cy="14" r="10" transform="rotate(-130 15 14)"/><circle class="core" cx="15" cy="32" r="3.5"/><path class="tip" d="M4 38 L15 46 L26 38 L15 64 Z"/></svg></div><header class="loq-head">
<span class="loq-tag tag">Cooler</span>
<h2 class="loq-head__title display"><span>강력한 쿨링</span><span class="loq-grad">흔들림 없는 퍼포먼스</span></h2>
<p class="loq-head__body body-lg">레노버 LOQ의 효율적인 쿨링 시스템은 대형 듀얼 팬과 넓은 배기 구조로<br>발열을 효과적으로 관리합니다. 장시간 게이밍에도 안정적인 성능을 유지하도록 돕고,<br><span class="loq-key loq-key--inline">Fn</span> + <span class="loq-key loq-key--inline loq-key--q">Q</span> 키로 사용 환경에 맞는 성능 모드를 간편하게 전환할 수 있습니다.</p>
</header></section></div>
</body>
</html>

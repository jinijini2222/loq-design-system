<!--
# BenefitTrio

큰 사진 카드 하단의 혜택 3열(PSD: 배터리 섹션).

- 3등분, 칸 사이 1px 점선(#c5c2c6 26%).
- 제목 `title-sm` 흰색, 강조 수치는 `<mark>`(highlight-pink + pink-300 21% 하이라이트 바). 부제 `body-md` `ink-150`.
- 아래 130px 링 아이콘: 7px 트랙 `ring-track` + 브랜드 그라데이션 아크 + `ring-dot` 빛나는 끝점. 중앙 수치는 `ring-num` 그라데이션.
- 카드 아래 13px 띄우고 `loq-note` 각주(caption, ink-400 88%).
-->

# HeroIntro

페이지 첫 화면. `subhero`(lavender) → `display` 2줄 → 모델 필 → 연결선 → 인트로 카드.

- 인트로 카드는 `loq-cut loq-intro`: `line-violet` 테두리, `gradient-card` 면, `cut-lg`.
- 영문 슬로건 `eyebrow`(대문자, accent-text) + `body-lg` 3줄.
- 연결선 끝 노드 점이 카드 윗변에 닿게 카드에 -6px 겹친다.
-->
<head><meta charset="utf-8">

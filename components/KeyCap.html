<!--
# KeyCap

단축키·모드 표시.

- 키캡 `loq-key`: 52 × 52, `surface-key` 바탕, 2px 테두리(Fn `key-pink`, Q `loq-key—q` `key-violet`), `radius-key`, 글자 `key`.
- 본문 안 인라인 키캡 `loq-key—inline`: 높이 34, 22 Bold.
- 모드 칩 `loq-mode`: 높이 48 필, `surface-plum` 바탕, 글자 `chip` `key-pink`, 오른쪽 38px 원형 아이콘.
- 사진 카드 위에 올릴 때는 좌상단 모드 칩, 우상단 키캡 조합(16px 안쪽).
-->

<div class="pad"><div class="row"><span class="loq-mode chip">공부 모드<i><svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><path d="M13 6l3 3"/></svg></i></span><span class="loq-mode chip">게임 모드<i><svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><path d="M13 6l3 3"/></svg></i></span><span class="loq-keys"><span class="loq-key key">Fn</span>+<span class="loq-key loq-key--q key">Q</span></span></div>
<p class="body-lg" style="margin-top:40px;color:var(--ink-200)"><span class="loq-key loq-key--inline">Fn</span> + <span class="loq-key loq-key--inline loq-key--q">Q</span> 키로 사용 환경에 맞는 성능 모드를 간편하게 전환할 수 있습니다.</p></div>
